name: tape-collector

# Records the Delta India BTCUSD aggressor tape 24/7 on GitHub's servers.
# Two schedules work together (GitHub caps a single job at 6h, so one job
# can never cover the whole day by itself):
#   - main windows:   every 6h at :33 (off-peak minute — GitHub drops/delays
#     round-hour crons), 350 min each
#   - bridge windows: every 6h at :27, 45 min — starts right after each main
#     window ends and runs into the next one, so cron noise (±20 min) can
#     never create a gap; overlap is deduped at merge time
# One NDJSON file per recording window (tape-<date>-<startHHMM>.ndjson), so
# seam overlap lands in separate files — dedupe by trade timestamp at merge.
# NOTE: GitHub may auto-disable schedules after 60 days with no repo activity —
# the daily commits below keep the repo active.
# Runs free on a public repo (private repos also fit the 2000 free min/month).

on:
  schedule:
    - cron: '33 */6 * * *'          # main windows (off-peak minute)
    - cron: '27 */6 * * *'          # bridge windows across the seams
  workflow_dispatch:                # manual start button (records a main window)

permissions:
  contents: write

concurrency:
  # separate groups so a bridge job runs in PARALLEL with the tail of the
  # previous main window instead of queueing behind it (queueing would
  # recreate exactly the gap we are bridging)
  group: ${{ github.event.schedule == '27 */6 * * *' && 'tape-bridge' || 'tape-main' }}
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: record tape
        run: node collector/record.js
        env:
          RECORD_MINUTES: ${{ github.event.schedule == '27 */6 * * *' && '45' || '350' }}
          GIT_SHA: ${{ github.sha }}

      - name: commit tape
        run: |
          git config user.name "tape-bot"
          git config user.email "tape-bot@users.noreply.github.com"
          # another window may have committed while we were recording —
          # replay our commit on top before pushing (per-window files make
          # this conflict-free)
          git pull --rebase origin main
          git add data/
          git diff --cached --quiet || git commit -m "tape ${{ github.run_id }} $(date -u +%F-%H%M)"
          git push
