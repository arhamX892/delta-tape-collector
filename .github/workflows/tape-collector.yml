name: tape-collector

# Records the Delta India BTCUSD aggressor tape ~24/7 in near-continuous 6h windows.
# Runs free on a public repo (private repos also fit the 2000 free min/month).

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours UTC
  workflow_dispatch:          # manual start button

permissions:
  contents: write

concurrency:
  group: tape-collector
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: record tape (~5h50m)
        run: node collector/record.js
        env:
          RECORD_MINUTES: '350'

      - name: commit tape
        run: |
          git config user.name "tape-bot"
          git config user.email "tape-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "tape ${{ github.run_id }} $(date -u +%F-%H%M)"
          git push
